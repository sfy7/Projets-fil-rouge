# ─────────────────────────────────────────────────────────────
# ConfigMap — Variables non-sensibles
# Reprend exactement les mêmes variables que le docker-compose.yaml
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: portfolio-config
  namespace: portfolio
data:
  NODE_ENV:    "production"
  PORT:        "5000"
  # DNS interne Kubernetes : <nom-du-service>.<namespace>.svc.cluster.local
  #MONGO_URI:   "mongodb://mongo-service.portfolio.svc.cluster.local:27017/portfolio"
  MONGO_URI:    "mongodb://mongo-service:27017/portfolio"
  
  # Le frontend est exposé sur le NodePort 30080
  CORS_ORIGIN: "http://localhost:30080"

---
# ─────────────────────────────────────────────────────────────
# Secret — Variables sensibles encodées en base64
# Pour changer le mot de passe :  echo -n "nouveau_mdp" | base64
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: portfolio-secret
  namespace: portfolio
type: Opaque
data:
  # "password123" encodé en base64
  mongo-root-password: cGFzc3dvcmQxMjM=