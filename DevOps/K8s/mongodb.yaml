# StatefulSet MongoDB — stockage persistant des données de l'application
# Les données survivent aux redémarrages grâce au volume mongo-data-mongo-0
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: portfolio
  labels:
    app: mongo
spec:
  serviceName: mongo-headless
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: "portfolio"
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok || quit(1)"
            initialDelaySeconds: 30   # plus de marge au démarrage
            periodSeconds: 15         # moins fréquent = moins de charge CPU
            timeoutSeconds: 15
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok || quit(1)"
            initialDelaySeconds: 60   # laisse MongoDB bien démarrer
            periodSeconds: 30         # peu fréquent, juste pour détecter un crash
            timeoutSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi