# =============================================================================
# GRAFANA - Provisioning automatique des dashboards
# =============================================================================
apiVersion: 1

providers:
  - name: 'Portfolio Dashboards'
    orgId: 1
    folder: 'Portfolio'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
